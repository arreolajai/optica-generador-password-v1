<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Licencias | Óptica 360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-6 min-h-screen flex items-center justify-center">
    
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl max-w-sm w-full border-t-4 border-emerald-500">
        <h2 class="text-2xl font-bold text-center mb-6 text-emerald-400">
            <i class="fa-solid fa-key"></i> KeyGen Admin
        </h2>
        
        <p class="text-slate-400 text-sm mb-4 text-center">Genera una nueva licencia para Óptica 360 y envíasela al cliente.</p>
        
        <label class="block text-sm font-semibold text-slate-300 mb-2">Vigencia del acceso:</label>
        <select id="tipo-licencia" class="w-full border-0 p-3 rounded bg-slate-700 text-white font-semibold mb-6 outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="7">Prueba Extendida (7 días)</option>
            <option value="30">Suscripción Mensual (30 días)</option>
            <option value="180">Suscripción Semestral (180 días)</option>
            <option value="365">Suscripción Anual (365 días)</option>
        </select>
        
        <button onclick="generarClave()" class="w-full bg-emerald-600 text-white font-bold p-3 rounded hover:bg-emerald-500 transition mb-6 shadow-lg shadow-emerald-500/30">
            Generar Código de Activación
        </button>

        <div class="bg-slate-950 p-4 rounded text-center border border-slate-700 mb-4">
            <span id="clave-generada" class="font-mono font-bold text-xl text-emerald-400 tracking-widest select-all">---</span>
        </div>

        <button onclick="copiarClave()" id="btn-copiar" class="w-full bg-slate-700 text-white font-semibold p-2 rounded hover:bg-slate-600 transition flex items-center justify-center gap-2">
            <i class="fa-regular fa-copy"></i> Copiar para enviar
        </button>
    </div>

    <script>
        const SECRET_PIN = "OPTO360"; // Debe ser el mismo que en la app principal

        function generarClave() {
            const dias = document.getElementById('tipo-licencia').value;
            // Genera 4 caracteres alfanuméricos aleatorios para hacer cada clave única
            const aleatorio = Math.random().toString(36).substring(2, 6).toUpperCase();
            
            // Estructura de la clave: DIAS-SECRETO-ALEATORIO
            const nuevaClave = `${dias}-${SECRET_PIN}-${aleatorio}`;
            
            document.getElementById('clave-generada').innerText = nuevaClave;
            
            // Resetear el botón de copiar
            const btn = document.getElementById('btn-copiar');
            btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar para enviar';
            btn.classList.replace('bg-emerald-600', 'bg-slate-700');
        }

        function copiarClave() {
            const clave = document.getElementById('clave-generada').innerText;
            if (clave === "---") return;

            navigator.clipboard.writeText(clave).then(() => {
                const btn = document.getElementById('btn-copiar');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> ¡Copiado!';
                btn.classList.replace('bg-slate-700', 'bg-emerald-600');
            });
        }
    </script>
</body>
</html>
